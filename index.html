<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #1b1b1b; height: 100vh; display: flex;
         align-items: center; justify-content: center; color: #fff;
         font-family: Arial, sans-serif; overflow: hidden; }
  #quake { font-size: 22px; }
  .shake { animation: shake 0.5s infinite; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    10% { transform: translate(-4px, -2px) rotate(-0.5deg); }
    20% { transform: translate(4px, 2px) rotate(0.5deg); }
    30% { transform: translate(-4px, 2px) rotate(-0.5deg); }
    40% { transform: translate(4px, -2px) rotate(0.5deg); }
    50% { transform: translate(-2px, 3px); }
    60% { transform: translate(2px, -3px); }
    70% { transform: translate(-3px, 1px); }
    80% { transform: translate(3px, -1px); }
    90% { transform: translate(-1px, 2px); }
  }
</style>
</head>
<body>
  <div id="quake" class="shake">Earthquake incoming...</div>
</body>
</html>
